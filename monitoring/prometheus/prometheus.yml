global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {instance: mon01}
      - targets: ["192.168.56.11:9100"]
        labels: {instance: srv01}
