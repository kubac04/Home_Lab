apiVersion: 1
groups:
    - orgId: 1
      name: homelab
      folder: Homelab
      interval: 30s
      rules:
        - uid: ag4lp0lgmm9kwa
          title: Host DOWN
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: up{job="node"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            summary: Host {{ $labels.instance }} nie odpowiada od ponad minuty
          isPaused: false
          notification_settings:
            receiver: Discord
        - uid: ssh-bruteforce
          title: SSH brute force
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P8E80F9AEF21F6940
              model:
                editorMode: code
                expr: >-
                  sum by (ip) (count_over_time({host="srv01", app="sshd"}
                  |~ "Failed password|Invalid user"
                  | regexp `from (?P<ip>\d+\.\d+\.\d+\.\d+)` [1m]))
                queryType: instant
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params: [5]
                refId: C
          noDataState: OK
          execErrState: Error
          for: 0s
          labels:
            severity: critical
          annotations:
            summary: "Możliwy brute force SSH na srv01 z {{ $labels.ip }} ({{ $values.A.Value }} prób w 1 min)"
          notification_settings:
            receiver: Discord