apiVersion: 1
templates:
  - orgId: 1
    name: discord
    template: |
      {{ define "discord.title" }}{{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}{{ end }}

      {{ define "discord.message" }}{{ range .Alerts }}{{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} {{ .Annotations.summary }} · [Szczegóły]({{ .GeneratorURL }})
      {{ end }}{{ end }}
